services:
  - type: web
    name: best-home-backend
    runtime: python
    buildCommand: ""
    startCommand: gunicorn best_home_location.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: best_home_location.settings
      - key: DATABASE_URL
        fromDatabase:
          name: best-home-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11
    plan: free
